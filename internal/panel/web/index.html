<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中转面板</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e6e9ef; --txt:#1f2329; --dim:#8a919f;
  --acc:#3b82f6; --accsoft:#eaf2ff; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --oksoft:#e8f9ef; --warnsoft:#fff7e6; --errsoft:#fdecec; --hover:#f7f9fc;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
html[data-theme=dark]{
  --bg:#0f1115; --card:#161a20; --line:#262c36; --txt:#d6dae0; --dim:#7d8794;
  --acc:#4f8cf7; --accsoft:#1a2536; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  --oksoft:#122419; --warnsoft:#251d0a; --errsoft:#2a1214; --hover:#1b2027;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
input,select,button,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{width:200px;flex:0 0 200px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 18px;font-weight:600;font-size:15px;letter-spacing:.2px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
nav{padding:10px 8px;flex:1;overflow:auto}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;
  color:var(--dim);cursor:pointer;font-size:13.5px;margin-bottom:2px;user-select:none}
.navitem:hover{background:var(--hover);color:var(--txt)}
.navitem.on{background:var(--accsoft);color:var(--acc);font-weight:500}
.navitem svg{width:16px;height:16px;flex:0 0 16px}
.navitem .badge{margin-left:auto;background:var(--err);color:#fff;border-radius:9px;
  padding:0 6px;font-size:11px;line-height:17px;height:17px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:15px;font-weight:600;margin:0}
.topbar .sp{flex:1}
.content{padding:20px 22px 40px;width:100%}

/* ---------- 通用 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>.hd h3{margin:0;font-size:14px;font-weight:600}
.card>.bd{padding:16px 18px}
.card>.bd.flush{padding:0}
.sp{flex:1}
.dim{color:var(--dim)}
.sm{font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

button{background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:6px 13px;cursor:pointer;font-size:13px;transition:.12s;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;line-height:1.4}
button svg{flex:0 0 auto;vertical-align:middle}
button:hover{background:var(--hover);border-color:#d0d5dd}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--err);border-color:var(--line)}
button.danger:hover{background:var(--errsoft);border-color:var(--err)}
button.ghost{background:transparent;border-color:transparent;padding:5px 8px}
button.ghost:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:not-allowed}
button.icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;
  justify-content:center;border-radius:6px}
button.icon svg{width:14px;height:14px}

input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px;outline:none;transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(59,130,246,.12)}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;font-size:12.5px;color:var(--dim);background:var(--hover);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
td.ops{white-space:nowrap;text-align:right}
td.ops button{margin-left:4px}

/* ---------- 标签 / 进度 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:11px;
  font-size:11.5px;line-height:19px;border:1px solid transparent;white-space:nowrap}
.t-ok{color:var(--ok);background:var(--oksoft);border-color:rgba(34,197,94,.25)}
.t-warn{color:var(--warn);background:var(--warnsoft);border-color:rgba(245,158,11,.25)}
.t-err{color:var(--err);background:var(--errsoft);border-color:rgba(239,68,68,.25)}
.t-info{color:var(--acc);background:var(--accsoft);border-color:rgba(59,130,246,.25)}
.t-grey{color:var(--dim);background:var(--hover);border-color:var(--line)}

.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:90px;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .3s}
.bar.warn>i{background:var(--warn)}
.bar.err>i{background:var(--err)}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:15px 17px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--dim);margin-bottom:7px}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
.stat .d{font-size:12px;color:var(--dim);margin-top:5px}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .search{position:relative;max-width:230px}
.toolbar .search input{padding-left:31px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--dim)}

/* ---------- 弹窗 ---------- */
dialog{border:none;border-radius:12px;padding:0;background:var(--card);color:var(--txt);
  box-shadow:0 20px 50px rgba(16,24,40,.2);width:min(520px,92vw)}
dialog::backdrop{background:rgba(16,24,40,.45);backdrop-filter:blur(2px)}
.dlg-hd{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.dlg-bd{padding:18px 20px;max-height:66vh;overflow:auto}
.dlg-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
label{display:block;margin:13px 0 5px;font-size:12.5px;color:var(--dim)}
label:first-child{margin-top:0}
.hint{font-size:12px;color:var(--dim);margin:-4px 0 10px;line-height:1.5}
pre{background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:12px;
  font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0;font-family:ui-monospace,monospace}

/* ---------- 空状态 ---------- */
.empty{padding:52px 20px;text-align:center;color:var(--dim)}
/* 只作用于空状态的大图标，别波及按钮里的小图标 */
.empty > svg{width:38px;height:38px;opacity:.35;margin-bottom:12px}
.empty p{margin:0 0 14px;font-size:13px}

/* ---------- 登录 ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login .box{width:352px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:32px 30px;box-shadow:var(--shadow)}
.login .box .lg{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login .box .lg b{font-size:16px}
.login .err{color:var(--err);font-size:12.5px;min-height:19px;margin-top:9px}

/* ---------- 顶部小元素 ---------- */
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:7px;
  background:var(--hover);border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.chip b{color:var(--txt);font-weight:600}
/* =====================================================================
   手机端：侧栏改底部导航，表格横向滚动
   ===================================================================== */
@media (max-width: 768px){
  /* 布局：取消两栏，侧栏固定在底部 */
  .layout{display:block}
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;
    width:100%;height:auto;flex-direction:row;
    border-right:none;border-top:1px solid var(--line);
    z-index:60;background:var(--card);
    padding-bottom:env(safe-area-inset-bottom,0);
    box-shadow:0 -1px 3px rgba(16,24,40,.06);
    overflow:hidden;
  }
  .brand{display:none}

  /* 导航用 grid 自动等分，几项都能平均摆下 */
  nav{
    flex:1;min-width:0;              /* flex 子项默认 min-width:auto，会被内容撑爆 */
    display:grid;grid-auto-flow:column;
    grid-auto-columns:minmax(0,1fr);gap:2px;padding:5px 4px;
    overflow:hidden;
  }
  .navitem{
    position:relative;flex-direction:column;gap:3px;
    padding:7px 1px;font-size:10px;line-height:1.15;
    margin:0;min-width:0;border-radius:8px;justify-content:center;
  }
  .navitem svg{width:18px;height:18px;flex:none}
  .navitem span:not(.badge){
    width:100%;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .navitem .badge{
    position:absolute;top:3px;right:50%;transform:translateX(20px);
    margin:0;font-size:9px;line-height:14px;height:14px;padding:0 4px;
    min-width:14px;text-align:center;
  }

  main{width:100%;padding-bottom:74px}

  /* 顶栏：手机上去掉占地方的 chip，只留标题和按钮 */
  .topbar{height:auto;min-height:48px;padding:7px 10px;gap:6px;flex-wrap:wrap}
  .topbar h1{font-size:14px}
  .topbar .chip{display:none}
  .topbar select{width:auto!important;min-width:0;max-width:120px;font-size:12.5px;padding:5px 8px}
  .topbar .avatar{display:none}
  .topbar .sp{display:none}
  .topbar .ghost.icon{width:26px;height:26px}
  .content{padding:10px 10px 18px}

  /* 统计卡两列 */
  .stats{grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:10px}
  .stat{padding:11px 12px}
  .stat .k{font-size:11.5px;margin-bottom:5px}
  .stat .v{font-size:17px}
  .stat .d{font-size:10.5px;margin-top:4px}
  .card{margin-bottom:10px;border-radius:9px;box-shadow:none}
  .card>.hd{padding:11px 12px;flex-wrap:wrap;gap:6px}
  .card>.hd h3{font-size:13.5px}
  .card>.bd{padding:12px}
  .toolbar{padding:9px 11px;gap:6px}
  .toolbar .search{max-width:none;width:100%;order:-1;margin-bottom:2px}
  .toolbar button{font-size:12px;padding:5px 9px}
  .hint{font-size:11px}

  /* 表格：横向滚动，给列留足宽度 */
  .card>.bd.flush{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card>.bd.flush table{min-width:780px}
  th,td{padding:9px 10px}
  th{font-size:11.5px}
  td.ops button{width:26px;height:26px}

  /* 弹窗铺满 */
  dialog{width:calc(100vw - 20px);max-width:520px;max-height:92vh;border-radius:11px}
  .dlg-hd{padding:13px 15px;font-size:14px}
  .dlg-bd{padding:13px 15px;max-height:66vh}
  .dlg-ft{padding:11px 15px;gap:8px}
  .dlg-ft button{flex:1}
  label{font-size:12px;margin:11px 0 4px}

  /* 登录框 */
  .login .box{width:calc(100vw - 32px);max-width:352px;padding:26px 22px}
  .login .box .lg b{font-size:15px}
}
@media (max-width: 380px){
  .stats{grid-template-columns:1fr}
  .navitem{font-size:9px;gap:2px}
  .navitem svg{width:16px;height:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   图标
   ===================================================================== */
const svg = (p, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" style="width:${w||16}px;height:${w||16}px">${p}</svg>`;

const I = {
  home: svg('<path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 13 15 13 15 22"/>'),
  route: svg('<path d="M4 6h10a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h12"/><polyline points="17 15 20 18 17 21"/>'),
  inbound: svg('<path d="M12 3v11"/><polyline points="7 9 12 14 17 9"/><path d="M5 21h14"/>'),
  outbound: svg('<path d="M12 14V3"/><polyline points="7 8 12 3 17 8"/><path d="M5 21h14"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>'),
  bell: svg('<path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  plus: svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  refresh: svg('<polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/>'),
  trash: svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  power: svg('<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>'),
  swap: svg('<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'),
  broom: svg('<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'),
  moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  logout: svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'),
  server: svg('<rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>'),
  copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  empty: svg('<circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="16" y2="12"/>', 38),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  upload: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
  download: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
  check: svg('<polyline points="20 6 9 17 4 12"/>'),
  x: svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
  edit: svg('<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>'),
};

/* =====================================================================
   状态
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 后端空集合可能序列化成 null，前端一律走这个兜底
const arr = v => Array.isArray(v) ? v : [];
// 把 API 异常统一变成可见的错误提示，而不是整页白屏
function safe(fn){ try{ return fn(); }catch(e){ console.error(e); return ''; } }

let S = {
  user: '',
  view: 'home',
  groups: [],
  cur: null,          // 当前分组对象
  nodes: [],          // 当前分组下所有节点（含 entry/exit）
  rules: [],
  events: [],
  alerts: [],
  ov: {},
  settings: {},
  theme: localStorage.getItem('theme') || 'light',
  sel: new Set(),     // 表格选中
};

document.documentElement.dataset.theme = S.theme;

/* =====================================================================
   工具
   ===================================================================== */
function gb(v){
  if(!v) return '0';
  const u=['B','KB','MB','GB','TB','PB']; let i=0,n=Number(v);
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (i>=3?n.toFixed(2):n.toFixed(0))+' '+u[i];
}
function pct(a,b){ return b>0 ? Math.min(100, a/b*100) : 0; }
function bar(a,b){
  const p = pct(a,b);
  const cls = p>=95?'bar err':p>=80?'bar warn':'bar';
  return `<div class="${cls}"><i style="width:${p}%"></i></div>`;
}
function ago(ts){
  if(!ts) return '从未';
  const d = Math.floor(Date.now()/1000)-ts;
  if(d<0) return '刚刚';
  if(d<60) return d+' 秒前';
  if(d<3600) return Math.floor(d/60)+' 分钟前';
  if(d<86400) return Math.floor(d/3600)+' 小时前';
  return Math.floor(d/86400)+' 天前';
}
function dt(ts){
  if(!ts) return '—';
  return new Date(ts*1000).toLocaleString('zh-CN',{hour12:false});
}
function statusTag(st){
  const m = {
    online:['t-ok','运行中'], standby:['t-grey','待命'], pending:['t-grey','未接入'],
    draining:['t-warn','收尾中'], exhausted:['t-err','已用尽'], dead:['t-err','失联'],
    disabled:['t-grey','已停用'],
  };
  const [c,t] = m[st]||['t-grey',st];
  return `<span class="tag ${c}">${t}</span>`;
}

// 面板到节点的 TCP 握手延迟。0=还没测过，-1=连不上
function rttText(r){
  if(!r) return '<span class="dim">—</span>';
  if(r < 0) return '<span style="color:var(--err)">不通</span>';
  const c = r < 80 ? 'var(--ok)' : r < 200 ? 'var(--warn)' : 'var(--err)';
  return `<span class="mono" style="color:${c}">${r} ms</span>`;
}

/* =====================================================================
   API
   ===================================================================== */
async function api(method, path, body){
  const opt={method,headers:{}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  const r = await fetch(path,opt);
  if(r.status===401 && path!=='/api/login'){ S.user=''; render(); throw new Error('未登录'); }
  const txt = await r.text();
  let data=null; try{ data = txt?JSON.parse(txt):null; }catch(e){ data={error:txt}; }
  if(!r.ok) throw new Error((data&&data.error)||('HTTP '+r.status));
  return data;
}

/* =====================================================================
   启动
   ===================================================================== */
async function boot(){
  try{ const me = await api('GET','/api/me'); S.user = me.user; }catch(e){ S.user=''; }
  if(!S.user){ renderLogin(); return; }
  try{
    await reload();
  }catch(e){
    console.error(e);
    S.groups=[]; S.nodes=[]; S.rules=[]; S.events=[]; S.alerts=[];
  }
  render();
}

async function reload(){
  S.groups = arr(await api('GET','/api/groups'));
  S.ov = (await api('GET','/api/overview')) || {};
  S.alerts = arr(await api('GET','/api/alerts?acked=0'));
  try{ S.settings = (await api('GET','/api/settings')) || {}; }catch(e){ S.settings = {}; }
  if(S.cur){
    const alive = S.groups.find(x=>x.group.id===S.cur.id);
    if(!alive) S.cur=null; else S.cur = alive.group;
  }
  if(!S.cur && S.groups.length) S.cur = S.groups[0].group;
  if(S.cur) await loadGroup(S.cur.id);
  else { S.nodes=[]; S.rules=[]; S.events=[]; }
}

async function loadGroup(id){
  S.nodes   = arr(await api('GET','/api/groups/'+id+'/nodes'));
  S.rules   = arr(await api('GET','/api/groups/'+id+'/rules'));
  S.events  = arr(await api('GET','/api/events?group_id='+id+'&limit=60'));
}

function renderLogin(){
  $('#app').innerHTML = `

  </div></div>`;

  $('#lu').focus();
}

async function doLogin(){
  const btn = document.querySelector('.login .box button');
  const errEl = $('#lerr');
  if(btn){ btn.disabled = true; btn.textContent = '登录中…'; }
  try{
    await api('POST','/api/login',{username:$('#lu').value.trim(),password:$('#lp').value});
    await boot();
  }catch(e){
    if(errEl) errEl.textContent = e.message;
    if(btn){ btn.disabled = false; btn.textContent = '登 录'; }
  }
}

function setMsg(id, text, ok){
  const el = $(id);
  if(!el) return;
  el.style.color = ok===false ? 'var(--err)' : ok===true ? 'var(--ok)' : 'var(--dim)';
  el.textContent = text;
}

async function saveSettings(){
  const tok = ($('#s_token')?.value||'').trim();
  const url = ($('#s_url')?.value||'').trim();
  const body = {};
  if(tok) body.cloudflare_token = tok;
  if(url) body.public_url = url;
  if(!Object.keys(body).length){ setMsg('#s_msg','没有改动','' ); return; }
  try{
    await api('POST','/api/settings', body);
    const st = await api('GET','/api/settings');
    S.settings = st;
    setMsg('#s_msg','已保存'+(tok?'，Token 立即生效':''), true);
    await reload(); render();
    toast('设置已保存');
  }catch(e){ setMsg('#s_msg', e.message, false); }
}

async function verifyToken(){
  setMsg('#s_msg','测试中…','');
  try{
    const r = await api('POST','/api/dns/verify');
    setMsg('#s_msg', '✅ '+(r.message||'Token 有效'), true);
  }catch(e){ setMsg('#s_msg', '❌ '+e.message, false); }
}

async function listZones(){
  setMsg('#s_msg','查询中…','');
  try{
    const zs = arr(await api('POST','/api/dns/zones'));
    setMsg('#s_msg', `这个 Token 能管 ${zs.length} 个域名`, true);
    $('#s_zones').innerHTML = zs.length
      ? zs.map(z=>`<div class="mono" style="padding:3px 0">${esc(z.name)} <span class="dim">${esc(z.id)}</span></div>`).join('')
      : '<span class="dim">没有可管理的域名，检查 Token 的区域范围</span>';
  }catch(e){ setMsg('#s_msg','❌ '+e.message, false); }
}

async function refresh(){ await reload(); render(); }
async function pickGroup(id){ await loadGroup(parseInt(id,10)); render(); }
function toggleTheme(){
  S.theme = S.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme = S.theme;
  localStorage.setItem('theme',S.theme);
  render();
}
async function logout(){ try{ await api('POST','/api/logout'); }catch(e){} S.user=''; render(); }

function selAll(el, kind){
  document.querySelectorAll(`input[data-sel="${kind}"]`).forEach(c=>{
    c.checked = el.checked;
    el.checked ? S.sel.add(Number(c.dataset.id)) : S.sel.delete(Number(c.dataset.id));
  });
  el.blur();
  updateSelBar();
}
function selOne(el){
  const id = Number(el.dataset.id);
  el.checked ? S.sel.add(id) : S.sel.delete(id);
  updateSelBar();
}
function updateSelBar(){
  const bar = $('#batchbar'), cnt = $('#selcnt');
  if(!bar) return;
  const n = S.sel.size;
  bar.style.display = n>0 ? '' : 'none';
  if(cnt) cnt.textContent = n;
}
function filterRows(){
  const q = ($('#q')?.value||'').trim().toLowerCase();
  document.querySelectorAll('tbody tr[data-search]').forEach(tr=>{
    tr.style.display = !q || tr.dataset.search.toLowerCase().includes(q) ? '' : 'none';
  });
}

async function promote(id){
  const n = S.nodes.find(x=>x.node.id===id);
  if(!confirm(`把域名切到「${n.node.name}」？\n\n新连接会走这台，已建立的连接不受影响。锁定 30 分钟内不会自动切走。`)) return;
  try{
    await api('POST','/api/nodes/'+id+'/promote');
    await reload(); render();
    toast('已切换，DNS 生效需要 1-2 分钟');
  }catch(e){ alert(e.message); }
}
async function resetNode(id){
  if(!confirm('清零这台的本周期用量？')) return;
  try{ await api('POST','/api/nodes/'+id+'/reset'); await reload(); render(); }
  catch(e){ alert(e.message); }
}
async function delNode(id){
  const n = S.nodes.find(x=>x.node.id===id);
  if(!confirm(`删除节点「${n.node.name}」？\n该机器上的 Agent 会失去控制，但转发进程继续跑。`)) return;
  try{ await api('DELETE','/api/nodes/'+id); await reload(); render(); }
  catch(e){ alert(e.message); }
}
async function toggleRule(id,en){
  try{ await api('PATCH','/api/rules/'+id,{enabled:!!en}); await loadGroup(S.cur.id); render(); }
  catch(e){ alert(e.message); }
}
async function delRule(id){
  if(!confirm('删除这条线路？')) return;
  try{ await api('DELETE','/api/rules/'+id); await loadGroup(S.cur.id); render(); }
  catch(e){ alert(e.message); }
}
async function ack(id){
  try{ await api('POST','/api/alerts/'+id+'/ack'); S.alerts = arr(await api('GET','/api/alerts?acked=0')); render(); }
  catch(e){ alert(e.message); }
}

function toast(msg){
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = `position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
    background:var(--txt);color:var(--card);padding:9px 18px;border-radius:8px;font-size:13px;
    z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:.2s`;
  document.body.appendChild(d);
  requestAnimationFrame(()=>d.style.opacity=1);
  setTimeout(()=>{ d.style.opacity=0; setTimeout(()=>d.remove(),220); },2200);
}

/* =====================================================================
   弹窗
   ===================================================================== */
function modal(title, bodyHtml, footHtml){
  const d = document.createElement('dialog');
  d.innerHTML = `<div class="dlg-hd">${title}</div>
    <div class="dlg-bd">${bodyHtml}</div>
    <div class="dlg-ft">${footHtml}</div>`;
  document.body.appendChild(d);
  d.showModal();
  d.addEventListener('click',e=>{ if(e.target===d) d.close(); });
  d.addEventListener('close',()=>d.remove());
  return d;
}
const closeDlg = () => document.querySelector('dialog')?.close();

/* ---------- 分组 ---------- */
function dlgGroup(isNew){
  const g = (isNew || !S.cur) ? null : S.cur;
  modal(g?'编辑分组':'新建分组', `
    <label>分组名</label>
    <input id="f_name" type="text" value="${g?esc(g.name):''}" placeholder="例如：日本线路">
    <label>备注</label>
    <input id="f_remark" type="text" value="${g?esc(g.remark):''}" placeholder="可选">
    <label>峰值带宽（Mbps）</label>
    <input id="f_peak" type="number" value="${g?(g.peak_bps*8/1e6).toFixed(0):200}">
    <div class="hint">只用来算切换余量：估算切换后旧节点还要跑掉多少流量。</div>
    <label>探活端口</label>
    <input id="f_probe" type="number" value="${g?g.probe_port:0}">
    <div class="hint">切换前探测节点是否可达。填 0 表示不探测，只信心跳。</div>
    <label>流量重置日（每月几号）</label>
    <input id="f_reset" type="number" min="1" max="28" value="${g?g.reset_day:1}">

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">
      <label style="margin-top:0">Cloudflare Zone</label>
      <input id="f_zone" type="text" value="${g?esc(g.dns_zone):''}" placeholder="example.com">
      <div class="hint">填域名就行，面板自己查 Zone ID。也可以直接填 32 位 ID。</div>
      <label>域名（完整记录名）</label>
      <input id="f_dnsname" type="text" value="${g?esc(g.dns_name):''}" placeholder="relay.example.com">
      <label>TTL（秒）</label>
      <input id="f_ttl" type="number" value="${g?g.dns_ttl:60}">
      <div class="hint">Cloudflare 免费版最小 60。切节点时改的就是这条 A 记录。</div>
      ${g?`<div class="row" style="margin-top:10px">
        <button onclick="testDNS(${g.id})">测试这条 DNS 配置</button>
      </div>
      <div id="f_dnsmsg" class="sm" style="margin-top:8px;min-height:18px"></div>`:''}
    </div>
  `, `
    <button onclick="closeDlg()">取消</button>
    <button class="primary" onclick="saveGroup(${g?g.id:0})">保存</button>
  `);
}

async function testDNS(id){
  setMsg('#f_dnsmsg','查询中…','');
  try{
    const r = await api('POST','/api/groups/'+id+'/dns-test');
    setMsg('#f_dnsmsg', (r.state==='found'?'✅ ':'ⓘ ')+r.message, true);
  }catch(e){ setMsg('#f_dnsmsg','❌ '+e.message, false); }
}

async function saveGroup(id){
  const body = {
    name: $('#f_name').value.trim(),
    remark: $('#f_remark').value.trim(),
    peak_mbps: parseInt($('#f_peak').value||'0',10),
    probe_port: parseInt($('#f_probe').value||'0',10),
    reset_day: parseInt($('#f_reset').value||'1',10),
    quota_gb: 0,
    dns_provider: 'cloudflare',
    dns_zone: ($('#f_zone')?.value||'').trim(),
    dns_name: ($('#f_dnsname')?.value||'').trim(),
    dns_ttl: parseInt($('#f_ttl')?.value||'60',10),
  };
  if(!body.name){ alert('分组名不能为空'); return; }
  try{
    if(id) await api('PATCH','/api/groups/'+id,body);
    else   await api('POST','/api/groups',body);
    closeDlg(); await reload(); render();
  }catch(e){ alert(e.message); }
}

/* ---------- 节点 ---------- */
function dlgNode(id){
  const n = id ? S.nodes.find(x=>x.node.id===id)?.node : null;
  modal(n?'编辑节点':'添加节点', `
    <label>名称</label>
    <input id="n_name" type="text" value="${n?esc(n.name):''}" placeholder="日本-A">
    <label>公网 IP</label>
    <input id="n_ip" type="text" value="${n?esc(n.ip):''}" placeholder="留空自动获取">
    <div class="hint">留空即可。节点首次心跳时面板会从连接里识别它的公网 IP 自动填入；<br>以后 IP 变了也会自动更新，正在生效的节点还会同步改 DNS。</div>
    <label>网卡名</label>
    <input id="n_iface" type="text" value="${n?esc(n.iface):'eth0'}">
    <div class="hint">OpenVZ 老机器一般是 venet0，别填错。</div>
    <label>计费口径</label>
    <select id="n_bill">
      <option value="both" ${!n||n.bill_mode==='both'?'selected':''}>双向（大多数商家）</option>
      <option value="tx" ${n&&n.bill_mode==='tx'?'selected':''}>只算出向</option>
      <option value="rx" ${n&&n.bill_mode==='rx'?'selected':''}>只算入向</option>
    </select>
    <label>本机流量配额（GB）</label>
    <input id="n_quota" type="number" value="${n?Math.round(n.quota_bytes/1073741824):200}">
    <div class="hint">按商家后台填。面板自动留 5% 余量，不用自己减。</div>

    <label style="display:flex;align-items:center;gap:9px;cursor:pointer;margin-top:16px;color:var(--txt)">
      <input type="checkbox" id="n_backup" ${n&&n.is_backup?'checked':''} style="width:auto;margin:0">
      <span>设为备用节点</span>
    </label>
    <div class="hint">备用节点不参与正常轮换。只有所有主用节点都用尽或失联时，才切到它兜底。</div>

    ${n?`
      <label>排序（数字小的先用）</label>
      <input id="n_order" type="number" value="${n.sort_order}">
      <div class="hint">${n.id===S.cur.current_node?'这台是当前节点。改 IP 会立刻同步到 DNS。':'切到这台时按排序依次轮换。'}</div>`:''}
  `, `
    <button onclick="closeDlg()">取消</button>
    <button class="primary" onclick="saveNode(${id||0})">${n?'保存':'创建并生成命令'}</button>
  `);
}

async function saveNode(id){
  const body = {
    name: $('#n_name').value.trim(),
    ip: $('#n_ip').value.trim(),
    iface: $('#n_iface').value.trim()||'eth0',
    bill_mode: $('#n_bill').value,
    quota_gb: parseInt($('#n_quota').value||'0',10),
    is_backup: !!$('#n_backup')?.checked,
  };
  if($('#n_order')) body.sort_order = parseInt($('#n_order').value||'0',10);
  if(!body.name){ alert('名称必填'); return; }
  try{
    if(id){
      await api('PATCH','/api/nodes/'+id, body);
      closeDlg(); await reload(); render();
      toast('节点已保存，Agent 15 秒内生效');
    }else{
      const res = await api('POST','/api/groups/'+S.cur.id+'/nodes', body);
      closeDlg(); await reload(); render();
      showCmd(res.cmd);
    }
  }catch(e){ alert(e.message); }
}

function showCmd(cmd){
  window.__cmd = cmd;
  modal('在节点服务器上执行', `
    <p class="hint" style="margin-top:0">以 root 执行。命令只显示这一次，跑完节点自动注册并拉取线路。</p>
    <pre id="cmdtext">${esc(cmd)}</pre>
  `, `
    <button onclick="closeDlg()">关闭</button>
    <button class="primary" onclick="copyCmd()">${I.copy} 复制命令</button>
  `);
}
function copyCmd(){
  navigator.clipboard.writeText(window.__cmd||'').then(()=>{ closeDlg(); toast('已复制到剪贴板'); });
}

/* ---------- 线路 ---------- */
function dlgRule(id){
  const r = id ? S.rules.find(x=>x.id===id) : null;
  const gname = r ? (S.groups.find(x=>x.group.id===r.group_id)?.group.name || S.cur.name) : '';
  modal(r?'编辑线路':'添加转发线路', `
    ${r
      ? `<label>所属分组</label>
         <div style="padding:7px 0;color:var(--txt)">${esc(gname)}</div>
         <div class="hint" style="margin-top:0">要换分组请删掉重建，端口规则按分组校验。</div>`
      : `<label>所属分组</label>
         <select id="r_gid">
           ${S.groups.map(x=>`<option value="${x.group.id}" ${S.cur&&S.cur.id===x.group.id?'selected':''}>${esc(x.group.name)}</option>`).join('')}
         </select>
         <div class="hint" style="margin-top:0">规则会同步到这个分组里的所有节点。</div>`}
    <label>名称</label>
    <input id="r_name" type="text" value="${r?esc(r.name||''):''}" placeholder="新加坡">
    <label>监听端口（域名后面那个端口）</label>
    <input id="r_lp" type="number" value="${r?r.listen_port:''}" placeholder="25380">
    <label>转发目标地址</label>
    <input id="r_th" type="text" value="${r?esc(r.target_host):''}" placeholder="1.2.3.4 或 example.com">
    <label>目标端口</label>
    <input id="r_tp" type="number" value="${r?r.target_port:''}" placeholder="443">
    <label>协议</label>
    <select id="r_proto">
      <option value="tcp" ${!r||r.protocol==='tcp'?'selected':''}>TCP</option>
    </select>
    ${r
      ? `<div class="hint" style="margin-top:14px">保存后所有节点 15 秒内拿到新配置。只改目标会热切换，现有连接不断。</div>`
      : `<div class="hint" style="margin-top:14px">这条规则会同步到分组里所有节点，域名指哪台哪台执行。</div>`}
  `, `
    <button onclick="closeDlg()">取消</button>
    <button class="primary" onclick="saveRule(${id||0})">${r?'保存':'创建'}</button>
  `);
}

async function saveRule(id){
  const body = {
    name: ($('#r_name')?.value||'').trim(),
    listen_port: parseInt($('#r_lp').value||'0',10),
    target_host: $('#r_th').value.trim(),
    target_port: parseInt($('#r_tp').value||'0',10),
    protocol: $('#r_proto').value,
  };
  if(!body.listen_port||!body.target_host||!body.target_port){
    alert('监听端口、目标地址、目标端口都要填');
    return;
  }
  const gid = id ? 0 : (parseInt($('#r_gid')?.value||'0',10) || S.cur.id);
  try{
    if(id){
      await api('PATCH','/api/rules/'+id, body);
      closeDlg(); await loadGroup(S.cur.id); render();
      toast('线路已保存');
    }else{
      await api('POST','/api/groups/'+gid+'/rules', body);
      closeDlg();
      if(gid !== S.cur.id){
        const g = S.groups.find(x=>x.group.id===gid)?.group;
        await reload(); render();
        toast('已添加到「'+(g?g.name:'该分组')+'」，切换分组后可见');
      }else{
        await loadGroup(S.cur.id); render();
        toast('线路已创建，节点 15 秒内开始监听');
      }
    }
  }catch(e){ alert(e.message); }
}

/* ---------- 批量导入 / 导出 ---------- */
function dlgImport(){
  modal('批量导入线路', `
    <p class="hint" style="margin-top:0">一行一个 JSON，和 Nyanpass 格式兼容，可直接贴：</p>
    <pre style="margin-bottom:12px">{"dest":["1.2.3.4:443"],"listen_port":25380,"name":"日本"}</pre>
    <label>粘贴内容</label>
    <textarea id="imp_text" rows="9" spellcheck="false"
      placeholder='{"dest":["18.141.35.11:25310"],"listen_port":25310,"name":"新加坡"}'
      style="font-family:ui-monospace,monospace;font-size:12px;resize:vertical"></textarea>
    <div class="hint">端口冲突的行会跳过，不影响其他行。空行和 # 开头的注释忽略。</div>
    <div id="imp_msg" class="sm" style="margin-top:10px;min-height:18px;white-space:pre-wrap"></div>
  `, `
    <button onclick="closeDlg()">取消</button>
    <button class="primary" onclick="doImport()">开始导入</button>
  `);
}

async function doImport(){
  const text = ($('#imp_text')?.value||'').trim();
  if(!text){ setMsg('#imp_msg','内容为空', false); return; }
  setMsg('#imp_msg','导入中…','');
  try{
    const r = await api('POST','/api/groups/'+S.cur.id+'/rules/import',{text});
    let msg = `新增 ${r.created} 条`;
    if(r.skipped) msg += `，跳过 ${r.skipped} 条`;
    if(r.errors && r.errors.length) msg += '\n' + r.errors.slice(0,8).join('\n');
    if(r.notes && r.notes.length) msg += '\n' + r.notes.slice(0,3).join('\n');
    setMsg('#imp_msg', msg, r.created>0);
    if(r.created>0){ await loadGroup(S.cur.id); }
  }catch(e){ setMsg('#imp_msg', e.message, false); }
}

async function dlgExport(){
  try{
    const resp = await fetch('/api/groups/'+S.cur.id+'/rules/export');
    const text = await resp.text();
    const n = text.split('\n').filter(x=>x.trim()).length;
    window.__exp = text;
    modal('导出线路', `
      <p class="hint" style="margin-top:0">共 ${n} 条，和 Nyanpass 格式一致，可以直接贴过去。</p>
      <pre style="max-height:380px;overflow:auto;font-size:11.5px">${esc(text || '（没有线路）')}</pre>
    `, `
      <button onclick="closeDlg()">关闭</button>
      <button onclick="downloadExport()">${I.download} 下载 .jsonl</button>
      <button class="primary" onclick="copyExport()">${I.copy} 复制</button>
    `);
  }catch(e){ alert(e.message); }
}

function copyExport(){
  navigator.clipboard.writeText(window.__exp||'').then(()=>{ closeDlg(); toast('已复制'); });
}

function downloadExport(){
  const blob = new Blob([window.__exp||''], {type:'application/x-ndjson'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'routes-'+(S.cur?.name||'group')+'.jsonl';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  closeDlg();
}

/* ---------- 批量操作 ---------- */
async function batchDelete(){
  const ids = [...S.sel];
  if(!ids.length) return;
  if(!confirm(`删除选中的 ${ids.length} 条线路？`)) return;
  try{
    const r = await api('POST','/api/groups/'+S.cur.id+'/rules/delete-batch',{ids});
    S.sel.clear();
    await loadGroup(S.cur.id); render();
    toast(`已删除 ${r.deleted} 条`);
  }catch(e){ alert(e.message); }
}

async function batchEnable(on){
  const ids = [...S.sel];
  if(!ids.length) return;
  try{
    const r = await api('POST','/api/groups/'+S.cur.id+'/rules/enable-batch',{ids,enabled:on});
    S.sel.clear();
    await loadGroup(S.cur.id); render();
    toast(`${on?'启用':'停用'}了 ${r.updated} 条`);
  }catch(e){ alert(e.message); }
}

/* =====================================================================
   启动
   ===================================================================== */
(async function(){
  await boot();
  setInterval(async ()=>{
    if(!S.user) return;
    try{ await reload(); render(); }catch(e){}
  }, 15000);
})();
</script>
